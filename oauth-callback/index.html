<!doctype html>
<html><head><meta charset="utf-8"><title>Tesla OAuth callback</title>
<style>body{font-family:system-ui,sans-serif;padding:40px;background:#111;color:#eee}
#u{word-break:break-all;background:#222;padding:16px;border-radius:8px;font-family:monospace;font-size:13px}
.ok{color:#4cd964}</style></head><body>
<h2>Tesla OAuth callback</h2>
<div id="s">Lähetetään koodia…</div>
<div id="u"></div>
<script>
var q=new URLSearchParams(location.search);
var code=q.get('code')||'', state=q.get('state')||'';
document.getElementById('u').textContent=location.href;
if(code){
  var img=new Image();
  img.onload=img.onerror=function(){document.getElementById('s').innerHTML='<span class="ok">Koodi lähetetty.</span>';};
  img.src='http://127.0.0.1:8770/catch?code='+encodeURIComponent(code)+'&state='+encodeURIComponent(state)+'&t='+Date.now();
  try{fetch('http://127.0.0.1:8770/catch?code='+encodeURIComponent(code)+'&state='+encodeURIComponent(state),{mode:'no-cors'});}catch(e){}
}else{document.getElementById('s').textContent='Ei code-parametria.';}
</script></body></html>
